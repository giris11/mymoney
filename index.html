<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>MyMoney</title>
    <script>
      /* Paint the right palette on the FIRST frame. The authoritative theme
         choice lives in IndexedDB (async), so waiting for React to mount means
         a dark-theme user gets a white flash on every cold start of the
         installed PWA. 'mymoney.theme' is a DISPLAY HINT, never a record
         (SPEC §3, D29): it holds one string ('system' | 'light' | 'dark')
         written by useThemeSync, and if it is missing, stale or unreadable the
         only cost is one corrected frame — src/ui/theme.ts re-applies the real
         setting after mount. Keep this in sync with resolveTheme(). */
      (function () {
        var hint = null;
        try {
          hint = window.localStorage.getItem('mymoney.theme');
        } catch (e) {
          /* Private mode / file:// / storage blocked — fall back to the OS. */
        }
        var dark =
          hint === 'dark' ||
          (hint !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
